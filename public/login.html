<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சக்தி எண்ணெய் மற்றும் மாவு ஆலை — Sign in</title>
  <script>
    // If a token is already saved, quickly verify it with the server
    // before deciding whether to skip the sign-in form.
    (function () {
      var t = localStorage.getItem('mavu_theme');
      if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') || urlParams.get('logout')) {
        localStorage.removeItem('mavu_token');
        localStorage.removeItem('mavu_user');
        return;
      }
      var token = localStorage.getItem('mavu_token');
      if (!token) return;
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then(function (res) { if (res.ok) window.location.replace('index.html'); })
        .catch(function () {});
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="auth-shell">

    <section class="auth-aside">
      <div class="auth-aside-brand">
        <div class="auth-aside-mark">ச</div>
        <div>
          <div class="brand-name">சக்தி ஆலை</div>
          <div class="brand-sub">Oil &amp; Flour Mill</div>
        </div>
      </div>

      <div class="auth-pitch">
        <h2>Every bill, every customer, in one place.</h2>
        <p>Print receipts at the counter, track regular customers by phone number, and see how the mill is doing at a glance.</p>
      </div>

      <p class="auth-foot">Sakthi Mill &middot; Billing &amp; Records</p>
    </section>

    <section class="auth-main">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 id="authMainTitle">Sign in</h1>
          <p class="header-sub" id="authSubTitle">உள்நுழைய</p>
        </div>

        <div class="auth-mode-pills" role="tablist" aria-label="Sign in or Sign up">
          <button type="button" class="auth-mode-pill active" id="tabSignIn">Sign in / உள்நுழைய</button>
          <button type="button" class="auth-mode-pill" id="tabSignUp">Sign up / பதிவு செய்க</button>
        </div>

        <div id="sessionNotice" class="auth-alert" style="display:none;" role="status"></div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="loginUsername">Username / பயனர்பெயர்</label>
            <input id="loginUsername" type="text" placeholder="Your username or email" autocomplete="username" required>
          </div>
          <div class="field-group">
            <label for="loginPassword">Password / கடவுச்சொல்</label>
            <input id="loginPassword" type="password" placeholder="Your password" autocomplete="current-password" required>
          </div>

          <div class="auth-options">
            <label class="remember-label" for="loginRememberMe">
              <input type="checkbox" id="loginRememberMe" name="rememberMe">
              <span>Remember me (30 days) / என்னை நினைவில் கொள்க</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width:100%;margin-top:0.5rem">Sign in</button>
          <p class="form-message" id="loginError" aria-live="polite"></p>

          <p class="auth-switch-prompt">
            Don't have an account? <button type="button" class="btn-link-auth" id="linkToSignup">Create account / புதிய கணக்கு</button>
          </p>
        </form>

        <form id="signupForm" style="display:none;" novalidate>
          <div class="field-group">
            <label for="signupName">Full Name / முழுப் பெயர்</label>
            <input id="signupName" type="text" placeholder="e.g. Revanth" autocomplete="name" required>
          </div>
          <div class="field-group">
            <label for="signupUsername">Username / பயனர்பெயர்</label>
            <input id="signupUsername" type="text" placeholder="e.g. revanth or revanth@gmail.com" autocomplete="username" required>
          </div>
          <div class="field-group">
            <label for="signupRole">Account Role / கணக்கு வகை</label>
            <select id="signupRole">
              <option value="admin">Admin / நிர்வாகி (Full access)</option>
              <option value="staff">Staff / பணியாளர் (Billing counter)</option>
            </select>
          </div>
          <div class="field-group">
            <label for="signupPassword">Password / கடவுச்சொல் <span style="color:var(--faint);font-weight:500">— min 6 chars</span></label>
            <input id="signupPassword" type="password" placeholder="Choose a password (min 6 characters)" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="field-group">
            <label for="signupConfirmPassword">Confirm Password / கடவுச்சொல்லை உறுதிப்படுத்து</label>
            <input id="signupConfirmPassword" type="password" placeholder="Re-type your password" autocomplete="new-password" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary" id="signupSubmitBtn" style="width:100%;margin-top:0.5rem">Create account &amp; Sign in</button>
          <p class="form-message" id="signupError" aria-live="polite"></p>

          <p class="auth-switch-prompt">
            Already have an account? <button type="button" class="btn-link-auth" id="linkToSignin">Sign in / உள்நுழைய</button>
          </p>
        </form>
      </div>
    </section>

  </main>

  <script src="auth.js" defer></script>
</body>
</html>
